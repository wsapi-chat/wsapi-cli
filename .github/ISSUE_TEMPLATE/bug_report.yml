name: Bug Report
description: Report a bug in the WSApi CLI
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact `wsapi` command you ran (with sensitive values redacted).
      placeholder: 'wsapi messages text --to 1234567890@s.whatsapp.net --text "hello"'
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: stdout/stderr from the command, including any error JSON. Redact tokens.
      render: shell

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: input
    id: cli-version
    attributes:
      label: CLI Version
      description: Output of `wsapi --version`.
      placeholder: e.g., 0.1.0
    validations:
      required: true

  - type: dropdown
    id: node-version
    attributes:
      label: Node.js Version
      options:
        - '18'
        - '20'
        - '22'
        - Other
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - npm install -g
        - npx
        - From source
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, logs, or screenshots.
